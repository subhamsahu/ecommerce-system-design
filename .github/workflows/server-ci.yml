name: Server CI

on:
  push:
    branches: [main, temp]
  pull_request:

jobs:
  verify-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_test_only
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://ecommerce:ecommerce_test_only@localhost:5432/ecommerce_test
      SECRET_KEY: test-only-secret-that-is-never-used-in-production
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app
      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head
      - name: Run API contract tests
        run: pytest -q
